<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D3F0FF"/>
      <stop offset="0.6" stop-color="#9ADBFB"/>
      <stop offset="1" stop-color="#5CC6F7"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ocean" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#5CC6F7"/>
      <stop offset="0.7" stop-color="#2AA7E8"/>
      <stop offset="1" stop-color="#1480C4"/>
    </radialGradient>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#1FA65A"/>
    </linearGradient>
    <linearGradient id="bubO" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFA066"/>
      <stop offset="1" stop-color="#FF7F3F"/>
    </linearGradient>
    <linearGradient id="bubL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A597FF"/>
      <stop offset="1" stop-color="#7C6CF0"/>
    </linearGradient>
    <clipPath id="globeClip"><circle cx="0" cy="0" r="130"/></clipPath>
    <path id="sp" d="M0,-10 C1,-2 2,-1 10,0 C2,1 1,2 0,10 C-1,2 -2,1 -10,0 C-2,-1 -1,-2 0,-10Z"/>
  </defs>

  <rect width="1200" height="500" fill="url(#bg)"/>
  <circle cx="880" cy="250" r="300" fill="url(#halo)"/>
  <g fill="#FFFFFF" opacity="0.9">
    <g transform="translate(220 100)"><ellipse cx="0" cy="10" rx="80" ry="18"/><circle cx="-22" cy="0" r="24"/><circle cx="20" cy="-8" r="32"/></g>
    <g transform="translate(560 60) scale(0.6)"><ellipse cx="0" cy="10" rx="80" ry="18"/><circle cx="-22" cy="0" r="24"/><circle cx="20" cy="-8" r="32"/></g>
  </g>
  <!-- soft ground -->
  <path d="M0,440 C300,420 700,425 1200,415 V500 H0Z" fill="#2AA7E8" opacity="0.35"/>

  <!-- paper plane trail -->
  <path d="M470,340 C560,290 560,210 630,190 C690,174 704,224 668,226 C636,228 640,172 690,150" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="10 12" stroke-linecap="round" opacity="0.9"/>
  <!-- paper plane -->
  <g transform="translate(748 132) rotate(-12) scale(1.1)">
    <path d="M50,-24 L-50,2 L-12,10Z" fill="#FFFFFF"/>
    <path d="M50,-24 L-12,10 L-4,34Z" fill="#DCEBF3"/>
    <path d="M50,-24 L-12,10 L-26,16Z" fill="#FF7F3F"/>
  </g>

  <!-- globe stand -->
  <g transform="translate(880 260)">
    <ellipse cx="0" cy="186" rx="90" ry="12" fill="#0E5E99" opacity="0.25"/>
    <path d="M-150,40 A160,160 0 0 0 40,155" fill="none" stroke="#FF7F3F" stroke-width="12" stroke-linecap="round" transform="rotate(-20)"/>
    <rect x="-8" y="140" width="16" height="36" fill="#E86A2C"/>
    <rect x="-60" y="172" width="120" height="16" rx="8" fill="#FF7F3F"/>
    <!-- globe -->
    <g transform="rotate(-18)">
      <circle r="130" fill="url(#ocean)"/>
      <g clip-path="url(#globeClip)">
        <path d="M-120,-60 C-90,-90 -40,-100 -20,-80 C0,-60 -30,-40 -10,-20 C10,0 -20,30 -50,20 C-80,10 -90,40 -110,30 C-140,10 -140,-40 -120,-60Z" fill="url(#land)"/>
        <path d="M20,-120 C50,-130 90,-110 100,-80 C110,-50 80,-40 70,-20 C60,0 30,-10 20,-30 C10,-50 -10,-80 20,-120Z" fill="url(#land)"/>
        <path d="M30,30 C60,20 100,40 110,70 C120,100 90,120 60,110 C30,100 0,60 30,30Z" fill="url(#land)"/>
        <path d="M-60,70 C-40,60 -20,80 -30,100 C-40,120 -70,110 -70,90 C-70,80 -66,74 -60,70Z" fill="url(#land)"/>
        <g fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.35">
          <ellipse rx="130" ry="44"/>
          <ellipse rx="130" ry="96"/>
          <ellipse rx="50" ry="130"/>
          <ellipse rx="100" ry="130"/>
          <path d="M0,-130 V130 M-130,0 H130"/>
        </g>
        <circle cx="-50" cy="-60" r="80" fill="#FFFFFF" opacity="0.12"/>
      </g>
    </g>
  </g>

  <!-- speech bubbles with squiggles -->
  <g transform="translate(1060 120)">
    <path d="M-80,-50 H80 C96,-50 104,-42 104,-26 V22 C104,38 96,46 80,46 H10 L-14,74 L-16,46 H-80 C-96,46 -104,38 -104,22 V-26 C-104,-42 -96,-50 -80,-50Z" fill="url(#bubO)"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round">
      <path d="M-70,-18 c10,-12 20,12 30,0 c10,-12 20,12 30,0 c10,-12 20,12 30,0"/>
      <path d="M-70,14 c10,-12 20,12 30,0 c10,-12 20,12 30,0"/>
      <circle cx="54" cy="14" r="3" fill="#FFFFFF"/>
    </g>
  </g>
  <g transform="translate(680 300)">
    <path d="M-70,-44 H70 C86,-44 94,-36 94,-20 V18 C94,34 86,42 70,42 H-20 L-44,68 L-40,42 H-70 C-86,42 -94,34 -94,18 V-20 C-94,-36 -86,-44 -70,-44Z" fill="url(#bubL)"/>
    <g fill="#FFFFFF">
      <circle cx="-40" cy="0" r="10"/>
      <circle cx="0" cy="0" r="10"/>
      <circle cx="40" cy="0" r="10"/>
    </g>
  </g>
  <g transform="translate(1090 330)">
    <path d="M-56,-36 H56 C70,-36 76,-30 76,-16 V14 C76,28 70,34 56,34 H30 L44,58 L6,34 H-56 C-70,34 -76,28 -76,14 V-16 C-76,-30 -70,-36 -56,-36Z" fill="#FFFFFF"/>
    <g fill="none" stroke="#2AA7E8" stroke-width="6" stroke-linecap="round">
      <path d="M-50,-8 q12,-14 24,0 t24,0 t24,0"/>
      <path d="M-50,12 q12,-14 24,0 t24,0"/>
    </g>
    <path d="M30,8 l8,8 l14,-18" fill="none" stroke="#1FA65A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>


  <g fill="#FFFFFF">
    <use href="#sp" transform="translate(980 60) scale(1.3)"/>
    <use href="#sp" transform="translate(1160 230) scale(0.9)"/>
    <use href="#sp" transform="translate(600 230) scale(0.9)"/>
  </g>
  <g fill="#FF7F3F">
    <use href="#sp" transform="translate(800 430) scale(0.8)"/>
    <use href="#sp" transform="translate(1150 60) scale(0.8)"/>
  </g>
</svg>
