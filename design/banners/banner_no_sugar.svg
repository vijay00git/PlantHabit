<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE6EA"/>
      <stop offset="0.6" stop-color="#FFC2CD"/>
      <stop offset="1" stop-color="#FF9AAE"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="apple" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#FF6B7F"/>
      <stop offset="0.7" stop-color="#E8344F"/>
      <stop offset="1" stop-color="#B81F3A"/>
    </radialGradient>
    <radialGradient id="berry" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FF6B7F"/>
      <stop offset="1" stop-color="#D42A48"/>
    </radialGradient>
    <radialGradient id="blue" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#A597FF"/>
      <stop offset="1" stop-color="#5A4CC4"/>
    </radialGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4E6EA"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1FA65A"/>
      <stop offset="1" stop-color="#13803F"/>
    </linearGradient>
    <path id="leaf" d="M0,0 C10,-20 34,-26 52,-22 C44,-6 22,6 0,0Z"/>
    <g id="straw">
      <path d="M0,-38 C26,-38 34,-14 30,6 C24,30 8,42 0,44 C-8,42 -24,30 -30,6 C-34,-14 -26,-38 0,-38Z" fill="url(#berry)"/>
      <g fill="#FFE27A">
        <ellipse cx="-14" cy="-16" rx="2" ry="3.2"/><ellipse cx="2" cy="-22" rx="2" ry="3.2"/><ellipse cx="16" cy="-14" rx="2" ry="3.2"/>
        <ellipse cx="-18" cy="4" rx="2" ry="3.2"/><ellipse cx="-2" cy="-2" rx="2" ry="3.2"/><ellipse cx="14" cy="6" rx="2" ry="3.2"/>
        <ellipse cx="-8" cy="20" rx="2" ry="3.2"/><ellipse cx="6" cy="24" rx="2" ry="3.2"/>
      </g>
      <path d="M0,-34 L-22,-46 L-8,-38 L-12,-56 L0,-40 L12,-56 L8,-38 L22,-46Z" fill="#1FA65A" stroke="#1FA65A" stroke-width="4" stroke-linejoin="round"/>
    </g>
    <path id="sp" d="M0,-10 C1,-2 2,-1 10,0 C2,1 1,2 0,10 C-1,2 -2,1 -10,0 C-2,-1 -1,-2 0,-10Z"/>
  </defs>

  <rect width="1200" height="500" fill="url(#bg)"/>
  <circle cx="870" cy="250" r="300" fill="url(#halo)"/>
  <!-- playful blobs -->
  <path d="M120,80 C170,40 250,60 260,110 C270,160 200,190 150,170 C90,150 70,120 120,80Z" fill="#FFFFFF" opacity="0.45"/>
  <circle cx="460" cy="70" r="16" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="1150" cy="70" r="30" fill="#FFFFFF" opacity="0.45"/>
  <g fill="#FFFFFF" opacity="0.5">
    <use href="#leaf" transform="translate(380 180) rotate(-30) scale(1.4)"/>
    <use href="#leaf" transform="translate(80 300) rotate(20) scale(1.2)"/>
  </g>

  <!-- ground / table -->
  <path d="M0,420 C300,405 600,410 1200,400 V500 H0Z" fill="url(#g2)"/>

  <!-- plate -->
  <ellipse cx="870" cy="408" rx="270" ry="40" fill="#0B5A2C" opacity="0.25"/>
  <ellipse cx="870" cy="396" rx="262" ry="40" fill="url(#plate)"/>
  <ellipse cx="870" cy="392" rx="210" ry="28" fill="#FFF6F8"/>

  <!-- orange slice (back right) -->
  <g transform="translate(1010 300)">
    <circle r="78" fill="#FF7F3F"/>
    <circle r="68" fill="#FFF1D6"/>
    <circle r="62" fill="#FFA458"/>
    <g stroke="#FFF1D6" stroke-width="5" stroke-linecap="round">
      <path d="M0,-58 V58 M-58,0 H58 M-41,-41 L41,41 M41,-41 L-41,41"/>
    </g>
    <circle r="8" fill="#FFF1D6"/>
  </g>

  <!-- apple (center) -->
  <g transform="translate(840 300)">
    <path d="M0,-70 C-30,-92 -96,-84 -100,-14 C-104,50 -50,96 -14,82 C-6,78 6,78 14,82 C50,96 104,50 100,-14 C96,-84 30,-92 0,-70Z" fill="url(#apple)"/>
    <path d="M0,-68 C-2,-86 4,-100 14,-112" fill="none" stroke="#7A4A1E" stroke-width="8" stroke-linecap="round"/>
    <path d="M8,-96 C24,-124 64,-128 84,-112 C64,-90 30,-86 8,-96Z" fill="#4ADE80"/>
    <path d="M10,-97 C34,-108 56,-112 80,-112" fill="none" stroke="#1FA65A" stroke-width="3"/>
    <ellipse cx="-56" cy="-30" rx="14" ry="26" fill="#FFFFFF" opacity="0.35" transform="rotate(20 -56 -30)"/>
  </g>

  <!-- strawberries -->
  <use href="#straw" transform="translate(700 350) rotate(-20) scale(1.2)"/>
  <use href="#straw" transform="translate(960 372) rotate(15) scale(1.05)"/>

  <!-- blueberries -->
  <g>
    <circle cx="1080" cy="380" r="18" fill="url(#blue)"/>
    <circle cx="1110" cy="372" r="16" fill="url(#blue)"/>
    <circle cx="1098" cy="352" r="15" fill="url(#blue)"/>
    <circle cx="770" cy="392" r="15" fill="url(#blue)"/>
    <g fill="#2B2178" opacity="0.6">
      <circle cx="1080" cy="374" r="4"/><circle cx="1110" cy="366" r="3.5"/><circle cx="1098" cy="347" r="3.5"/><circle cx="770" cy="387" r="3.5"/>
    </g>
  </g>

  <!-- cherries -->
  <g transform="translate(640 230)">
    <path d="M0,-80 C-10,-50 -30,-20 -30,10 M0,-80 C10,-50 26,-20 30,16" fill="none" stroke="#13803F" stroke-width="5" stroke-linecap="round"/>
    <path d="M0,-80 C20,-100 50,-96 60,-80 C40,-70 16,-70 0,-80Z" fill="#1FA65A"/>
    <circle cx="-30" cy="24" r="22" fill="url(#apple)"/>
    <circle cx="30" cy="30" r="22" fill="url(#apple)"/>
    <circle cx="-38" cy="16" r="5" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="22" cy="22" r="5" fill="#FFFFFF" opacity="0.5"/>
  </g>

  <!-- crossed-out candy -->
  <g transform="translate(1110 150) rotate(-15)">
    <circle r="50" fill="#FFFFFF" opacity="0.9"/>
    <path d="M-34,0 L-50,-16 L-50,16Z" fill="#A597FF"/>
    <path d="M34,0 L50,-16 L50,16Z" fill="#A597FF"/>
    <ellipse cx="0" cy="0" rx="30" ry="20" fill="#A597FF"/>
    <path d="M-14,-18 C-6,0 -6,0 -14,18 M2,-20 C10,0 10,0 2,20" fill="none" stroke="#FFFFFF" stroke-width="5" opacity="0.8"/>
    <circle r="50" fill="none" stroke="#EF4F72" stroke-width="9"/>
    <path d="M-35,-35 L35,35" stroke="#EF4F72" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- leaves accents -->
  <g fill="#1FA65A">
    <use href="#leaf" transform="translate(600 400) rotate(-150) scale(1.2)"/>
    <use href="#leaf" transform="translate(1140 395) rotate(-30) scale(1.1)"/>
  </g>
  <g fill="#4ADE80">
    <use href="#leaf" transform="translate(620 404) rotate(-120) scale(0.9)"/>
  </g>

  <g fill="#FFFFFF">
    <use href="#sp" transform="translate(760 160) scale(1.4)"/>
    <use href="#sp" transform="translate(960 160) scale(1)"/>
    <use href="#sp" transform="translate(560 300) scale(0.8)"/>
  </g>
  <g fill="#EF4F72">
    <use href="#sp" transform="translate(1000 80) scale(0.9)"/>
  </g>
</svg>
