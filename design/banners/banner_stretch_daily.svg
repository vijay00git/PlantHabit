<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB27A"/>
      <stop offset="0.55" stop-color="#FFD39A"/>
      <stop offset="0.85" stop-color="#FFEBC2"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF4C2" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#FFD27A" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#FFD27A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE27A"/>
      <stop offset="1" stop-color="#FF9F45"/>
    </linearGradient>
    <linearGradient id="g0" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FDCA0"/>
      <stop offset="1" stop-color="#4ADE80"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2BC56B"/>
      <stop offset="1" stop-color="#1FA65A"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1FA65A"/>
      <stop offset="1" stop-color="#13803F"/>
    </linearGradient>
    <linearGradient id="mat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7F3F"/>
      <stop offset="1" stop-color="#FFA066"/>
    </linearGradient>
    <path id="leaf" d="M0,0 C10,-20 34,-26 52,-22 C44,-6 22,6 0,0Z"/>
    <path id="sp" d="M0,-10 C1,-2 2,-1 10,0 C2,1 1,2 0,10 C-1,2 -2,1 -10,0 C-2,-1 -1,-2 0,-10Z"/>
  </defs>

  <rect width="1200" height="500" fill="url(#sky)"/>
  <circle cx="880" cy="270" r="280" fill="url(#sunGlow)"/>
  <circle cx="880" cy="280" r="130" fill="url(#sun)"/>
  <g fill="#FFF4E0" opacity="0.9">
    <g transform="translate(300 100)"><ellipse cx="0" cy="10" rx="80" ry="18"/><circle cx="-22" cy="0" r="24"/><circle cx="20" cy="-8" r="32"/></g>
    <g transform="translate(1100 120) scale(0.6)"><ellipse cx="0" cy="10" rx="80" ry="18"/><circle cx="-22" cy="0" r="24"/><circle cx="20" cy="-8" r="32"/></g>
  </g>
  <g fill="none" stroke="#E86A2C" stroke-width="3" stroke-linecap="round" opacity="0.5">
    <path d="M620,140 q8,-8 16,0 q8,-8 16,0"/>
    <path d="M660,115 q6,-6 12,0 q6,-6 12,0"/>
  </g>

  <!-- hills -->
  <path d="M0,330 C160,290 320,300 470,320 C640,342 760,300 940,300 C1060,300 1140,320 1200,316 V500 H0Z" fill="url(#g0)"/>
  <path d="M0,385 C200,360 380,365 560,378 C760,392 900,360 1200,365 V500 H0Z" fill="url(#g1)"/>
  <path d="M0,445 C220,428 420,432 620,442 C820,452 980,430 1200,432 V500 H0Z" fill="url(#g2)"/>

  <!-- yoga mat (perspective) -->
  <g transform="translate(880 418)">
    <ellipse cx="0" cy="12" rx="190" ry="16" fill="#0B5A2C" opacity="0.3"/>
    <path d="M-170,-10 L170,-10 L190,16 L-190,16Z" fill="url(#mat)"/>
    <path d="M-190,16 H190 V22 H-190Z" fill="#D8652A"/>
    <path d="M-150,0 H150" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="8 10" opacity="0.5"/>
    <!-- rolled end -->
    <ellipse cx="200" cy="4" rx="16" ry="18" fill="#D8652A"/>
    <ellipse cx="200" cy="4" rx="9" ry="10" fill="#FFA066"/>
  </g>

  <!-- figure in tree pose, arms overhead -->
  <g transform="translate(880 410)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M0,-6 V-122" stroke="#0B1410" stroke-width="20"/>
    <path d="M0,-6 H20" stroke="#0B1410" stroke-width="12"/>
    <path d="M6,-118 L54,-84 L8,-66" stroke="#0B1410" stroke-width="18"/>
    <path d="M-12,-200 L-46,-252 L-6,-304" stroke="#0B1410" stroke-width="14"/>
    <path d="M12,-200 L46,-252 L6,-304" stroke="#0B1410" stroke-width="14"/>
    <path d="M0,-128 V-196" stroke="#1FA65A" stroke-width="44"/>
    <path d="M-10,-140 C-6,-170 -6,-185 -8,-200" stroke="#4ADE80" stroke-width="5" opacity="0.6"/>
    <circle cx="0" cy="-238" r="21" fill="#0B1410" stroke="none"/>
    <circle cx="0" cy="-310" r="9" fill="#0B1410" stroke="none"/>
  </g>

  <!-- leaves -->
  <g fill="#13803F">
    <use href="#leaf" transform="translate(1130 440) rotate(-80) scale(1.6)"/>
    <use href="#leaf" transform="translate(1150 440) rotate(-50) scale(1.3)"/>
    <use href="#leaf" transform="translate(640 445) rotate(-120) scale(1.2)"/>
  </g>
  <g fill="#4ADE80">
    <use href="#leaf" transform="translate(1120 440) rotate(-110) scale(1.3)"/>
    <use href="#leaf" transform="translate(655 445) rotate(-80) scale(1)"/>
  </g>
  <!-- floating leaves -->
  <g fill="#1FA65A">
    <use href="#leaf" transform="translate(1040 180) rotate(-20) scale(0.8)"/>
    <use href="#leaf" transform="translate(700 230) rotate(30) scale(0.7)"/>
  </g>

  <g fill="#FFFFFF">
    <use href="#sp" transform="translate(1010 110) scale(1.3)"/>
    <use href="#sp" transform="translate(740 330) scale(0.9)"/>
    <use href="#sp" transform="translate(1100 280) scale(0.8)"/>
  </g>
</svg>
