<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8F9EE"/>
      <stop offset="0.7" stop-color="#C6F2D5"/>
      <stop offset="1" stop-color="#9BE7B6"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF4C2" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFF4C2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#1FA65A"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1FA65A"/>
      <stop offset="1" stop-color="#13803F"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A4E68"/>
      <stop offset="1" stop-color="#262838"/>
    </linearGradient>
    <linearGradient id="wingL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A597FF"/>
      <stop offset="1" stop-color="#7C6CF0"/>
    </linearGradient>
    <path id="leaf" d="M0,0 C10,-20 34,-26 52,-22 C44,-6 22,6 0,0Z"/>
    <g id="flower">
      <g fill="#FFFFFF">
        <circle cx="0" cy="-11" r="9"/><circle cx="10.5" cy="-3.4" r="9"/><circle cx="6.5" cy="9" r="9"/><circle cx="-6.5" cy="9" r="9"/><circle cx="-10.5" cy="-3.4" r="9"/>
      </g>
      <circle r="6" fill="#FACC32"/>
    </g>
    <g id="flowerL">
      <g fill="#A597FF">
        <circle cx="0" cy="-11" r="9"/><circle cx="10.5" cy="-3.4" r="9"/><circle cx="6.5" cy="9" r="9"/><circle cx="-6.5" cy="9" r="9"/><circle cx="-10.5" cy="-3.4" r="9"/>
      </g>
      <circle r="6" fill="#FFF4C2"/>
    </g>
    <g id="fly">
      <ellipse cx="-14" cy="-10" rx="16" ry="20" fill="url(#wingL)" transform="rotate(-25 -14 -10)"/>
      <ellipse cx="14" cy="-10" rx="16" ry="20" fill="url(#wingL)" transform="rotate(25 14 -10)"/>
      <ellipse cx="-10" cy="12" rx="10" ry="12" fill="#A597FF" transform="rotate(20 -10 12)"/>
      <ellipse cx="10" cy="12" rx="10" ry="12" fill="#A597FF" transform="rotate(-20 10 12)"/>
      <rect x="-3" y="-16" width="6" height="34" rx="3" fill="#3A2F8A"/>
      <path d="M-1,-16 C-4,-24 -8,-28 -12,-30 M1,-16 C4,-24 8,-28 12,-30" fill="none" stroke="#3A2F8A" stroke-width="2" stroke-linecap="round"/>
    </g>
    <path id="sp" d="M0,-10 C1,-2 2,-1 10,0 C2,1 1,2 0,10 C-1,2 -2,1 -10,0 C-2,-1 -1,-2 0,-10Z"/>
  </defs>

  <rect width="1200" height="500" fill="url(#bg)"/>
  <circle cx="1040" cy="90" r="170" fill="url(#sunGlow)"/>
  <circle cx="1040" cy="90" r="52" fill="#FACC32"/>
  <circle cx="1040" cy="90" r="40" fill="#FFE27A"/>

  <g fill="#FFFFFF" opacity="0.9">
    <g transform="translate(260 110)"><ellipse cx="0" cy="10" rx="80" ry="18"/><circle cx="-22" cy="0" r="24"/><circle cx="20" cy="-8" r="32"/></g>
    <g transform="translate(700 70) scale(0.6)"><ellipse cx="0" cy="10" rx="80" ry="18"/><circle cx="-22" cy="0" r="24"/><circle cx="20" cy="-8" r="32"/></g>
  </g>
  <!-- distant hills -->
  <path d="M0,330 C180,290 330,300 480,320 C640,340 760,280 940,276 C1060,274 1140,295 1200,300 V500 H0Z" fill="#9BE7B6"/>
  <path d="M0,380 C200,350 380,360 560,372 C760,386 900,350 1200,355 V500 H0Z" fill="url(#g1)"/>
  <path d="M0,445 C220,425 420,430 620,440 C820,450 980,425 1200,428 V500 H0Z" fill="url(#g2)"/>

  <!-- phone lying face-down -->
  <g transform="translate(890 352) rotate(-8)">
    <ellipse cx="6" cy="78" rx="210" ry="26" fill="#0B5A2C" opacity="0.3"/>
    <rect x="-180" y="-74" width="360" height="160" rx="38" fill="#171925"/>
    <rect x="-180" y="-86" width="360" height="160" rx="38" fill="url(#phone)"/>
    <rect x="-174" y="-80" width="348" height="148" rx="33" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="3"/>
    <rect x="-156" y="-66" width="92" height="92" rx="24" fill="#1F2130"/>
    <circle cx="-131" cy="-41" r="15" fill="#2E3146" stroke="#5A5F7A" stroke-width="4"/>
    <circle cx="-89" cy="-41" r="15" fill="#2E3146" stroke="#5A5F7A" stroke-width="4"/>
    <circle cx="-131" cy="1" r="15" fill="#2E3146" stroke="#5A5F7A" stroke-width="4"/>
    <circle cx="-89" cy="1" r="6" fill="#FACC32" opacity="0.8"/>
    <circle cx="-136" cy="-46" r="4" fill="#FFFFFF" opacity="0.4"/>
    <circle cx="-94" cy="-46" r="4" fill="#FFFFFF" opacity="0.4"/>
    <path d="M-20,-86 H150" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.12"/>
  </g>

  <!-- vines overgrowing -->
  <g fill="none" stroke="#13803F" stroke-width="5" stroke-linecap="round">
    <path d="M660,400 C720,360 760,320 840,330 C920,340 960,300 1040,310 C1090,316 1110,340 1120,370"/>
    <path d="M760,410 C800,380 830,400 870,380"/>
    <path d="M980,320 C990,280 1010,250 1050,240"/>
  </g>
  <g fill="#1FA65A">
    <use href="#leaf" transform="translate(700 372) rotate(-60)"/>
    <use href="#leaf" transform="translate(780 334) rotate(-10)"/>
    <use href="#leaf" transform="translate(840 330) rotate(200)"/>
    <use href="#leaf" transform="translate(940 322) rotate(-40)"/>
    <use href="#leaf" transform="translate(1040 310) rotate(10)"/>
    <use href="#leaf" transform="translate(1100 345) rotate(80)"/>
    <use href="#leaf" transform="translate(1010 254) rotate(-70)"/>
  </g>
  <g fill="#4ADE80">
    <use href="#leaf" transform="translate(740 352) rotate(170) scale(0.8)"/>
    <use href="#leaf" transform="translate(890 336) rotate(-80) scale(0.9)"/>
    <use href="#leaf" transform="translate(990 318) rotate(150) scale(0.8)"/>
    <use href="#leaf" transform="translate(1050 240) rotate(-20) scale(0.8)"/>
    <use href="#leaf" transform="translate(830 390) rotate(-30) scale(0.7)"/>
  </g>
  <use href="#flower" transform="translate(880 322)"/>
  <use href="#flowerL" transform="translate(1000 306) scale(0.9)"/>
  <use href="#flower" transform="translate(1056 236) scale(0.8)"/>
  <use href="#flowerL" transform="translate(760 340) scale(0.8)"/>
  <use href="#flower" transform="translate(1118 372) scale(0.75)"/>

  <!-- tall grass / plants in front -->
  <g fill="#13803F">
    <path d="M1150,470 C1140,420 1150,380 1170,350 C1168,400 1165,430 1160,470Z"/>
    <path d="M1130,470 C1110,430 1100,410 1090,390 C1120,410 1135,440 1142,470Z"/>
    <path d="M640,470 C630,440 625,420 610,400 C640,420 650,445 652,470Z"/>
  </g>

  <!-- butterflies -->
  <use href="#fly" transform="translate(780 190) rotate(-15)"/>
  <use href="#fly" transform="translate(940 140) rotate(20) scale(0.75)"/>
  <use href="#fly" transform="translate(1150 220) rotate(-10) scale(0.6)"/>
  <path d="M700,240 C730,230 740,210 760,205" fill="none" stroke="#7C6CF0" stroke-width="2.5" stroke-dasharray="4 8" stroke-linecap="round" opacity="0.6"/>

  <g fill="#FFFFFF">
    <use href="#sp" transform="translate(860 230) scale(1.2)"/>
    <use href="#sp" transform="translate(620 140) scale(0.8)"/>
  </g>
  <g fill="#A597FF">
    <use href="#sp" transform="translate(1100 160) scale(0.9)"/>
  </g>
</svg>
